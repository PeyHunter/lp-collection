# Secrets this file reads, never committed:
#   lp-collection-db (scripts/wizard/deploy.sh): POSTGRES_PASSWORD
#   lp-collection-discogs (scripts/wizard/discogs.sh): DISCOGS_CONSUMER_KEY,
#     DISCOGS_CONSUMER_SECRET, APP_OWNER_DISCOGS_USERNAME, PUBLIC_URL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lp-collection-photos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lp-collection
spec:
  selector:
    app: lp-collection
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lp-collection
spec:
  replicas: 1
  # The app migrates the database on start, so two versions never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lp-collection
  template:
    metadata:
      labels:
        app: lp-collection
    spec:
      # On k3s-2 with PostgreSQL, which the app can't work without anyway. The photos volume is created on the node
      # of the first pod that mounts it, so a pod that could land on k3s-1 would strand the photos there.
      nodeSelector:
        kubernetes.io/hostname: k3s-2
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The Argo CD Application sets the immutable sha-<commit> tag.
          image: ghcr.io/peyhunter/lp-collection:latest
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lp-collection-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://lp_collection:$(POSTGRES_PASSWORD)@postgres:5432/lp_collection
            - name: PHOTOS_DIR
              value: /var/lib/lp-collection/photos
          envFrom:
            - secretRef:
                name: lp-collection-discogs
          volumeMounts:
            - name: photos
              mountPath: /var/lib/lp-collection/photos
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          # /api/health turns 503 while the database is away, and a restart would not bring it back.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: lp-collection-photos
